services:
  postgres:
    image: postgres:16-alpine
    container_name: electronic_shop_db
    restart: always
    environment:
      POSTGRES_USER: electronic_user
      POSTGRES_PASSWORD: electronic_password
      POSTGRES_DB: electronic_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: electronic_shop_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: electronic_shop_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@electrotech.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
